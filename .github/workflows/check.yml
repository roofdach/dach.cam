name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - name: Install browser checks
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check drawing tools in both games
        run: |
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/dachcam-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/dachcam-next.log' EXIT
          node .github/scripts/check-drawing-ui.mjs
